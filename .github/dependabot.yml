# Everything is pinned (crates in Cargo.lock, Python packages with hashes, actions by commit, see
# ci.yml), so something has to propose the updates: security fixes in a pinned dependency don't
# arrive by themselves. Nor do new time zone rules, which the server has a copy of (jiff-tzdb).
version: 2
updates:
  - package-ecosystem: cargo # the server: Cargo.toml and Cargo.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: pip # the tools: requirements.in / requirements-dev.in and their compiled lock files
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker # the base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly
